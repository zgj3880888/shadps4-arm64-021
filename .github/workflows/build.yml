name: build-savefix-core

# Builds the Bachata S4 ARM64 emulator core with the save_data backup-callback
# port applied, using the exact same build path the upstream project uses:
# Debian trixie + arm64 multiarch + runtime/scripts/build-shadps4-arm64.sh.
#
# The upstream build script hardcodes CMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu,
# which only exists on Debian with the cross toolchain installed, so the job runs
# inside a debian:trixie container instead of on the Ubuntu runner directly.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CORE_URL: https://github.com/zenithblue-oss/shadps4-arm64.git
  CORE_REF: main

permissions:
  contents: read

jobs:
  build:
    name: arm64 core + save_data port
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 300

    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl
          git config --global --add safe.directory '*'
          git --version

      - name: Checkout port repo
        uses: actions/checkout@v4
        with:
          path: port

      - name: Clone Bachata ARM64 core (with submodules)
        run: |
          git clone --depth 1 --branch "$CORE_REF" \
            --recurse-submodules --shallow-submodules --jobs 8 \
            "$CORE_URL" core
          git -C core log -1 --format='core HEAD: %H %ci %s'

      - name: Apply save_data port
        run: bash port/scripts/apply-port.sh core

      - name: Record applied diff
        run: |
          git -C core diff --stat | tee port-applied.stat
          git -C core diff -- src/core/libraries/save_data > port-applied.diff

      - name: Install Debian cross-build dependencies
        working-directory: core
        run: bash runtime/scripts/install-debian-runtime-deps.sh

      - name: Build arm64 core
        working-directory: core
        run: |
          bash runtime/scripts/build-shadps4-arm64.sh 2>&1 | tee ../build.log
          tail -20 ../build.log

      - name: Verify produced ELF
        run: |
          bin=core/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
          ls -la "$bin"
          file "$bin"
          readelf -h "$bin" | grep -E 'Class|Machine'
          readelf -l "$bin" | grep -F '/lib/ld-linux-aarch64.so.1'
          cat core/runtime/build/shadps4-arm64-stage/needed.txt
          sha256sum "$bin" | tee shadps4-arm64.sha256

      - name: Upload patched core binary
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-arm64-savefix
          if-no-files-found: error
          path: |
            core/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
            core/runtime/build/shadps4-arm64-stage/needed.txt
            shadps4-arm64.sha256
            port-applied.stat
            port-applied.diff
            build.log

  inspect-apk:
    name: Inspect official APK layout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download official APK
        env:
          APK_VERSION: v0.2.5
        run: |
          curl -sSL --retry 3 -o app.apk \
            "https://github.com/JICA98/Bachata-S4/releases/download/${APK_VERSION}/bachatas4-0.2.5-release.apk"
          sha256sum app.apk | tee apk.sha256
          ls -la app.apk

      - name: Dump layout
        run: |
          sudo apt-get update && sudo apt-get install -y unzip file
          bash scripts/repack.sh app.apk /dev/null report-only.apk > layout.log 2>&1 || true
          cat layout.log

      - name: Upload layout report
        uses: actions/upload-artifact@v4
        with:
          name: apk-layout
          path: |
            layout.log
            apk.sha256
