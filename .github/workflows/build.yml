name: build-arm64-core

# Builds the Bachata S4 ARM64 emulator core: the whole Bachata ARM64 port (FEX guest CPU +
# Android SAF broker + managed patch sessions) rebased onto upstream shadps4-emu/shadPS4
# 0.21.1. Only the resulting core binary is produced here; the APK swap is a separate step.
#
# Three facts drive the shape of this workflow:
#   1. The core is cross-compiled with the project's own Debian multiarch script, which
#      hardcodes CMAKE_FIND_ROOT_PATH=/usr/aarch64-linux-gnu, so it must run inside a
#      debian:trixie container rather than on the Ubuntu runner.
#   2. The base checkout must be the Bachata ARM64 tree (it supplies runtime/scripts,
#      runtime/locks, FEX orchestration and the Android-specific sources). The port diff is
#      applied on top, so this job never needs write access to the upstream repo.
#   3. The APK has no standalone bin/shadps4-arm64: the guest userland is one stored zip at
#      assets/runtime/runtime.zip and the core lives inside it as host/shadps4-arm64-fex.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Base tree. Its runtime/ orchestration and FEX pin are reused as-is; the port patch replaces
  # the emulator sources with the upstream 0.21.1 ones plus the ARM64/Android glue.
  CORE_URL: https://github.com/Nyces/shadps4-arm64.git
  CORE_REF: main

permissions:
  contents: read

jobs:
  build:
    name: arm64 core (upstream 0.21.1 + bachata port)
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    timeout-minutes: 300

    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates curl nodejs
          git config --global --add safe.directory '*'
          git --version

      - name: Free runner disk space
        # 48 submodules, a full FEX build and cross-build objects do not fit next to the
        # preinstalled runner toolchains.
        run: |
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Checkout port repo
        uses: actions/checkout@v4
        with:
          path: port

      - name: Clone Bachata ARM64 core (with submodules)
        run: |
          git clone --depth 1 --branch "$CORE_REF" \
            --recurse-submodules --shallow-submodules --jobs 8 \
            "$CORE_URL" core
          git -C core log -1 --format='core base: %H %ci %s'
          df -h /

      - name: Apply the 0.21.1 ARM64 port
        run: bash port/scripts/apply-port.sh core

      - name: Dump rejects if the port did not apply
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: patch-rejects
          path: |
            core/**/*.rej
            core/**/*.orig
          if-no-files-found: ignore

      - name: Record applied diff
        run: |
          git -C core diff --stat | tail -20 | tee port-applied.stat
          git -C core diff --stat main 2>/dev/null | tail -3 || true

      - name: Install Debian cross-build dependencies
        working-directory: core
        run: bash runtime/scripts/install-debian-runtime-deps.sh

      - name: Build arm64 core (FEX + shadps4)
        working-directory: core
        run: |
          bash runtime/scripts/build-shadps4-arm64.sh 2>&1 | tee ../build.log
          tail -20 ../build.log

      - name: Verify and strip produced ELF
        run: |
          bin=core/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
          ls -la "$bin"
          file "$bin"
          readelf -h "$bin" | grep -E 'Class|Machine'
          readelf -l "$bin" | grep -F '/lib/ld-linux-aarch64.so.1'
          cp "$bin" unstripped-copy
          aarch64-linux-gnu-strip --strip-debug "$bin"
          echo "--- after strip ---"
          ls -la "$bin" unstripped-copy
          cat core/runtime/build/shadps4-arm64-stage/needed.txt
          sha256sum "$bin" | tee shadps4-arm64.sha256

      - name: Verify the port actually landed in the binary
        run: |
          bin=core/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64
          fail=0
          # CLI contract the Bachata S4+ 0.2.7 frontend relies on when it launches the core.
          for s in '--bachata-socket' '--bachata-storage-root' '--bachata-saf-socket' \
                   '--bachata-saf-token' '--patch-session'; do
            if grep -qaF "$s" "$bin"; then echo "OK   cli $s"; else echo "MISS cli $s"; fail=1; fi
          done
          # Android platform glue: SAF broker, FEX guest CPU, managed patch sessions.
          for s in 'saf-mirror' 'PATCH_SESSION_LOAD' 'PATCH_APPLIED' 'BACHATA_FEX_SIGNAL' \
                   'BACHATA_INPUT motion'; do
            if grep -qaF "$s" "$bin"; then echo "OK   glue $s"; else echo "MISS glue $s"; fail=1; fi
          done
          # Upstream 0.21.1 identity, proving this is not the 2026-06 base.
          for s in 'libSceJpegDec.sprx'; do
            if grep -qaF "$s" "$bin"; then echo "OK   base $s"; else echo "MISS base $s"; fail=1; fi
          done
          [ "$fail" -eq 0 ] || { echo "core does not match expectations"; exit 1; }

      - name: Stage artifacts
        run: |
          mkdir -p out
          cp core/runtime/build/shadps4-arm64-stage/bin/shadps4-arm64 out/
          cp core/runtime/build/shadps4-arm64-stage/needed.txt out/
          cp shadps4-arm64.sha256 port-applied.stat build.log out/
          ls -la out

      - name: Upload arm64 core
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-arm64-021
          if-no-files-found: error
          path: out/
